name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate launcher install targets
        run: node dist/cli.js setup --extension-id lekikondcgipaabofcppaifgmfbekhlf --dry-run

      - name: Validate packed install
        shell: bash
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/page-save-pack-test"
          npm install --prefix "$RUNNER_TEMP/page-save-pack-test" ./page-save-*.tgz
          "$RUNNER_TEMP/page-save-pack-test/node_modules/.bin/page-save" setup --extension-id lekikondcgipaabofcppaifgmfbekhlf --dry-run

      - name: Validate packed POSIX launcher writes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/page-save-home"
          HOME="$RUNNER_TEMP/page-save-home" "$RUNNER_TEMP/page-save-pack-test/node_modules/.bin/page-save" setup --extension-id lekikondcgipaabofcppaifgmfbekhlf
