<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Save</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>Page Save</h1>
    <div id="status" class="status disconnected">Disconnected</div>
  </header>

  <div id="controls">
    <button id="btn-refresh" title="Refresh tab list">Refresh</button>
    <button id="btn-select-all" title="Select all tabs">Select All</button>
    <button id="btn-deselect-all" title="Deselect all tabs">Deselect All</button>
  </div>

  <div id="tab-list"></div>

  <!-- Preview pane (Phase 10) — shown after extraction, before saving -->
  <div id="preview-pane" class="hidden">
    <div id="preview-header">
      <h2>Preview Extraction</h2>
      <span id="preview-count"></span>
    </div>
    <div id="preview-list"></div>
    <div id="preview-actions">
      <button id="btn-preview-save" class="btn-primary">Save Selected</button>
      <button id="btn-preview-discard" class="btn-secondary">Discard</button>
    </div>
  </div>

  <footer>
    <button id="btn-save" class="btn-primary" disabled>Save Selected (0)</button>
    <div id="progress" class="hidden">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text"></span>
    </div>
    <div id="last-session" class="hidden">
      <span id="session-info"></span>
    </div>
  </footer>

  <dialog id="setup-dialog" class="setup-dialog">
    <form method="dialog" class="setup-card">
      <div class="setup-header">
        <h2>Local Server Setup</h2>
        <button id="btn-close-setup" class="icon-button" value="close" aria-label="Close setup prompt">×</button>
      </div>
      <p class="setup-intro">
        Copy this prompt into your LLM assistant. It tells the assistant to verify the official project, explain the local server install, ask for permission, then configure Page Save for this browser.
      </p>
      <textarea id="setup-prompt" readonly spellcheck="false"></textarea>
      <div class="setup-actions">
        <button id="btn-copy-setup" class="btn-primary" type="button">Copy Prompt</button>
        <button class="btn-secondary" value="close">Close</button>
      </div>
      <div id="setup-copy-status" class="copy-status" aria-live="polite"></div>
    </form>
  </dialog>

  <script src="sidepanel.js"></script>
</body>
</html>
